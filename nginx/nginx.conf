worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolver — required for variable-based proxy_pass
    # so nginx re-resolves hostnames on each request instead of caching the
    # first resolution at startup (which breaks after container restart).
    resolver 127.0.0.11 valid=10s;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }


    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Rate limiting for login endpoints
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # Rate limiting for quarantine actions
    limit_req_zone $binary_remote_addr zone=quarantine:10m rate=10r/m;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────
    server {
        # default_server so the ACME listener wins over any other port-80 server.
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Docker DNS — re-resolve roundcube/backend hostnames per request
        # (overrides the http-level resolver for this server).
        resolver 127.0.0.11 valid=30s;

        # TLS certificates — certbot stores at /etc/letsencrypt/live/<domain>/
        # Self-signed certs are generated to the same path
        ssl_certificate     /etc/letsencrypt/live/mail.larp.tf/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mail.larp.tf/privkey.pem;

        # Modern TLS config
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;

        # Rate limit login form
        location = /login {
            limit_req zone=login burst=3 nodelay;
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Rate limit registration
        location = /register {
            limit_req zone=login burst=3 nodelay;
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Rate limit quarantine actions
        location /quarantine {
            limit_req zone=quarantine burst=5 nodelay;
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Add trailing slash to /webmail (required by Roundcube)
        location = /webmail {
            return 301 /webmail/;
        }

        # Block sensitive Roundcube paths (logs, config, temp, installer, data).
        # MUST come before the /webmail/ alias and the PHP regex below.
        location ~ ^/webmail/(logs|config|temp|installer|data)(/|$) {
            deny all;
        }

        # Roundcube — static files served directly from shared volume
        location /webmail/ {
            alias /var/www/roundcube/;
            index index.php;
        }

        # Roundcube — PHP files via FastCGI (SCRIPT_FILENAME strips /webmail/ prefix).
        # Variable + resolver so the upstream is re-resolved per request (like the
        # proxy_pass blocks above) instead of cached at startup.
        location ~ ^/webmail/(.+)\.php$ {
            set $roundcube_upstream roundcube:9000;
            fastcgi_pass $roundcube_upstream;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/$1.php;
            fastcgi_param QUERY_STRING $query_string;
        }

        # Public/unauthenticated endpoints — exempt from the admin login rate
        # limit (limit_req is not inherited into these dedicated locations).
        location /static {
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /pixel {
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /bimi {
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /unsubscribe {
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        # SOAP API kept unthrottled — the admin dashboard/API integration depends on it
        location /api/soap {
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Everything else → mailserver (admin surface, login rate-limited).
        # /login and /register keep their stricter dedicated zones; this covers
        # the other admin pages/actions.
        location / {
            limit_req zone=login burst=10 nodelay;
            set $backend "http://mailserver:8080";
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
